spring.application.name=spaceroom

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/spaceroom}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}

app.security.jwt.secret=${APP_JWT_SECRET:change-this-development-secret-with-at-least-32-characters}
app.security.jwt.expiration-minutes=${APP_JWT_EXPIRATION_MINUTES:480}
app.security.allowed-origins=${APP_ALLOWED_ORIGINS:http://localhost:5173}
