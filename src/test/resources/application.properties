spring.datasource.url=jdbc:h2:mem:spaceroom-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.type.preferred_enum_jdbc_type=VARCHAR
app.security.jwt.secret=test-secret-with-at-least-32-characters
app.security.jwt.expiration-minutes=480
app.security.allowed-origins=http://localhost:5173
